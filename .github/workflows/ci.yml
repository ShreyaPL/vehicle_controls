name: cpp-checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.lock
      - run: clang-format --dry-run --Werror include/vehicle_controls/*.hpp src/*.cpp tests/*.cpp
      - run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Debug -DVC_PYTHON=$(which python) -DVC_ROS2=OFF
      - run: cmake --build build/ci -j 2
      - run: ctest --test-dir build/ci --output-on-failure
      - run: bash scripts/tidy.bash build/ci
      - run: cmake --preset asan && cmake --build --preset asan -j 2 && ctest --preset asan
